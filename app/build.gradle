plugins { id 'com.android.application' }

// 0.79.0: ECG SCENARIOS (addenda 413, 414). The headline QT / T / ST now undo a 0.40 Hz strap input high-pass by default (as recorded is printed beside it and is one tap away). Every report lists the same averaged beat under each candidate strap high-pass model (as recorded, 0.03, 0.27, 0.35, 0.40, 0.50, 0.60, 1.50 Hz and one custom corner): QT, QTcF, T, ST, R. Settings > Your numbers: ECG strap model (which one is the headline; default as recorded), custom corner, and the roll-off correction of the 0.5-150 Hz detail beat (on by default). Each reading notes its model (strap_hp_fc_hz). Files: EcgScenario (new), EcgIntervals, EcgReport, EcgR16Analyzer, EcgPage, HealthActivity, MainActivity, NewLookActivity.
// 0.78.0: TRI-GO (Lab > T): one tap in copy A, B or C starts the ECG reading in all installed copies at one shared phone-clock time (TriGo.java, NewLookActivity, EcgPage, manifest <queries>). No change to the strap links, the day logger or the exports.
// 0.77.0: copy C, the third copy of the app for a third strap (addendum 369). gradle assembleDebug -PcopyC=1: applicationId com.noop.mgecg.c (installs beside A and B), launcher name "MG Heart C", versionName ending -C,
// its own Download folders (CopyB.SFX = C), no strap until the owner picks one, and strap B is never offered in its list. Copy A and copy B behave exactly as in 0.76.0.
// 0.76.0: beats are aligned twice in EcgR16Analyzer.peaks() (ankle / lead III readings: 7 ms jitter and one third of beats cut by the shape gate before, 1-3 ms and 0-1 % after; copy A unchanged); ALIGN2 and LATE_ART diagnostics in the R16_ANALYSIS line.
// 0.75.1: long values on the recovery page go under their label (they squeezed it to one letter per line), headings get space above.
// 0.75.0: Strap position gets Ankle R and Ankle L; the recovery page shows the night behind the two numbers (lowest 5 minutes, hour by hour, HRV filter share, where the night sits among the nights compared with).
// 0.71.2: Lab QUICK TICKS cut to one route of four short runs that need no meter number (rig gate, L1, G3, C2), numbered steps before each run, Next run button, meter wording corrected (the DT832 has no AC millivolt range); live graph header gets a dimmed BREATH cell (breaths a minute from the R-R, inferred, not checked against a breathing reference).
// 0.71.1: SleepNight.clusters joins the two halves of a night split by a long wake (addendum 301).

// 0.71.0: copy B has its own launcher icon (amber, with a B): manifest placeholder appIcon.
// 0.70.0: the second copy of the app, for a second strap (addendum 265). The normal build (gradle assembleDebug) is copy A, exactly as before.
// gradle assembleDebug -PcopyB=1 builds copy B: applicationId com.noop.mgecg.b (installs BESIDE copy A), launcher name "MG Heart B",
// versionName ending -B, its own Download folders (CopyB.SFX), and no strap until the owner picks one.
def copyB = project.hasProperty('copyB')
def copyC = project.hasProperty('copyC')

android { namespace 'com.noop.mgecg'; compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId copyC ? 'com.noop.mgecg.c' : (copyB ? 'com.noop.mgecg.b' : 'com.noop.mgecg')
        minSdk 26; targetSdk 34; versionCode 195
        versionName copyC ? '0.79.0-pro-C' : (copyB ? '0.79.0-pro-B' : '0.79.0-pro')
        buildConfigField 'boolean', 'COPY_B', copyB ? 'true' : 'false'
        buildConfigField 'boolean', 'COPY_C', copyC ? 'true' : 'false'
        manifestPlaceholders = [appLabel: copyC ? 'MG Heart C' : (copyB ? 'MG Heart B' : 'MG Heart'), appIcon: copyC ? '@mipmap/ic_launcher_c' : (copyB ? '@mipmap/ic_launcher_b' : '@mipmap/ic_launcher')]
    }
    // One fixed signing key for every build, so each new APK installs OVER the old one and keeps its data.
    // (Without it every CI run signs with a fresh random debug key and Android refuses the update.)
    signingConfigs {
        stable {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
    }
}
