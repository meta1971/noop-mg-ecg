plugins { id 'com.android.application' }

android { namespace 'com.noop.mgecg'; compileSdk 34
    defaultConfig { applicationId 'com.noop.mgecg'; minSdk 26; targetSdk 34; versionCode 79; versionName '0.19.2-logger' }
    // One fixed signing key for every build, so each new APK installs OVER the old one and keeps its data.
    // (Without it every CI run signs with a fresh random debug key and Android refuses the update.)
    signingConfigs {
        stable {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
    }
}
